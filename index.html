  chips('cT',Object.keys(TY).map(k=>[TY[k][0],k]),'type');chips('cS',SUG.map(s=>[s,s]),'sugar');chips('cI',ICE.map(s=>[s,s]),'ice');
}
function chips(id,items,f){$(id).innerHTML=items.map(it=>'<button class="chip" aria-pressed="'+(F[f]===it[1])+'" onclick="tg(\''+f+'\',\''+it[1]+'\')">'+it[0]+'</button>').join('')}
function tr(b){F.treat=!F.treat;b.setAttribute('aria-pressed',F.treat);$('pr').disabled=F.treat}
function tg(f,v){F[f]=(F[f]===v&&f!=='type'&&f!=='icon')?'':v;if(f==='type'){F.icon=v;if(v==='cvs'&&F.ice&&!['冰','熱'].includes(F.ice))F.ice='';if(v!=='cvs'&&F.ice==='冰')F.ice=''}refresh2()}
function refresh2(){$('sw').style.display=F.type==='cvs'?'none':'block';chips('cT',Object.keys(TY).map(k=>[TY[k][0],k]),'type');chips('cS',SUG.map(s=>[s,s]),'sugar');$('lbI').textContent=F.type==='cvs'?'冰或熱':'冰量';chips('cI',(F.type==='cvs'?['冰','熱']:ICE).map(s=>[s,s]),'ice');chips('cX',ICL.map(i=>[ico(i,28)+'<span style="font-size:14px">'+ICN[i]+'</span>',i]),'icon');$('cR').innerHTML=[1,2,3,4,5].map(n=>'<button class="st5" aria-label="'+n+'顆星" aria-pressed="'+(F.rating>=n)+'" onclick="rate('+n+')">'+STAR(F.rating>=n,34)+'</button>').join('')}
function closeDay(){$('sheet').hidden=true;document.body.style.overflow='';render()}
function shrink(file){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};im.onerror=()=>r(null);im.src=u})}
function pick(inp,f,lab){const file=inp.files[0];if(!file)return;const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{cp={im,f,lab,u,z:1,x:0,y:0};cpDraw()};im.onerror=()=>{$(lab).textContent='讀不到這張照片'};im.src=u;inp.value=''}
function cpDraw(){const o=$('picker');o.hidden=false;o.innerHTML='<div class="pbox"><canvas id="cv" width="280" height="280" style="width:100%;touch-action:none;border-radius:12px;background:#eee"></canvas><input type="range" id="zm" min="1" max="3" step=".05" value="1" style="width:100%" aria-label="縮放" oninput="cp.z=+this.value;cpPaint()"><p class="blank">拖曳照片、拉動滑桿，框出標籤</p><button class="btn fill" onclick="cpDone()">完成</button><button class="btn" onclick="closePk()">取消</button></div>';const c=$('cv');let d=null;c.onpointerdown=e=>{d=[e.clientX,e.clientY,cp.x,cp.y];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!d)return;const k=280/c.clientWidth;cp.x=d[2]+(e.clientX-d[0])*k;cp.y=d[3]+(e.clientY-d[1])*k;cpPaint()};c.onpointerup=()=>{d=null};cpPaint()}
function cpGeo(){const im=cp.im,s=Math.max(280/im.width,280/im.height)*cp.z,w=im.width*s,h=im.height*s;cp.x=Math.max(Math.min(cp.x,(w-280)/2),-(w-280)/2);cp.y=Math.max(Math.min(cp.y,(h-280)/2),-(h-280)/2);return [(280-w)/2+cp.x,(280-h)/2+cp.y,w,h]}
function cpPaint(){const g=cpGeo(),x=$('cv').getContext('2d');x.clearRect(0,0,280,280);x.drawImage(cp.im,g[0],g[1],g[2],g[3])}
function cpDone(){const g=cpGeo(),k=480/280,c=document.createElement('canvas');c.width=c.height=480;c.getContext('2d').drawImage(cp.im,g[0]*k,g[1]*k,g[2]*k,g[3]*k);F[cp.f]=c.toDataURL('image/jpeg',.7);$(cp.lab).textContent='已選好';URL.revokeObjectURL(cp.u);closePk()}
function push(o){
  data.entries.push(Object.assign({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),d:day,ts:day===key(new Date())?Date.now():new Date(day+'T12:00').getTime()},o));
  delete data.nodrink[day];persist();refresh(day===key(new Date()));toast('已貼上');
}
function add(){
  const name=F.name.trim();if(fe!==null){const q=F.type==='cvs'?'':F.sugar;data.favs[fe]={type:F.type,icon:F.icon,shop:F.shop.trim(),name:name||TY[F.type][0],sugar:q,ice:F.ice,price:(F.treat||F.price==='')?null:+F.price};fe=null;persist();F.name='';F.shop='';$('sp').value='';F.price='';$('nm').value='';$('pr').value='';$('addb').textContent='貼上這杯';refresh(1);toast('已更新常喝清單');return}
  const sg=F.type==='cvs'?'':F.sugar,ic=F.ice,ed=!!eid,o={type:F.type,icon:F.icon,shop:F.shop.trim(),name,sugar:sg,ice:ic,rating:F.rating||0,review:F.review.trim(),sticker:F.sticker,cup:F.cup,price:(F.treat||F.price==='')?null:+F.price,treat:F.treat};if(eid){Object.assign(data.entries.find(x=>x.id===eid),o);eid=null;persist();refresh(1);toast('已儲存修改')}else push(o);
  if(!ed&&F.name.trim()&&!data.favs.some(f=>f.name===name&&f.type===F.type))data.favs.push({type:F.type,icon:F.icon,shop:F.shop.trim(),name,sugar:sg,ice:ic,price:(F.treat||F.price==='')?null:+F.price});
  persist();F.name='';F.shop='';F.rating=0;F.review='';F.sugar='';F.ice='';F.sticker=null;F.cup=null;F.price='';F.treat=false;$('sp').value='';$('cm').value='';$('pr').value='';$('pr').disabled=false;$('tr').setAttribute('aria-pressed','false');$('nm').value='';$('addb').textContent='貼上這杯';$('f1').textContent='';$('f2').textContent='';$('box').classList.remove('on');refresh(day===key(new Date()));
}
function quick(i){const f=data.favs[i];push({type:f.type,icon:f.icon,shop:f.shop||'',name:f.name,sugar:f.sugar,ice:f.ice,price:f.price??null})}
function del(id){data.entries=data.entries.filter(e=>e.id!==id);persist();refresh(day===key(new Date()))}
function nod(){data.nodrink[day]?delete data.nodrink[day]:data.nodrink[day]=1;persist();refresh(true)}
applyTh();render();addEventListener('resize',()=>{if($('sheet').hidden)render()});document.fonts&&document.fonts.ready.then(()=>{if($('sheet').hidden)render()});
</script>
